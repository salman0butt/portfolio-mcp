name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard Vercel server autodetection
        run: |
          if [ -e src/server.ts ] || [ -e src/server.js ] || [ -e src/server.mjs ] || [ -e src/server.cjs ]; then
            echo "Do not add src/server.*: Vercel auto-detects it as the application server entrypoint."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t portfolio-mcp:ci .
